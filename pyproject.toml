[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "foxi"
version = "0.3.0"
description = "Set a TikTok profile banner from your computer via a private Android emulator."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []  # standard library only

[project.scripts]
foxi = "rcfo.app:main"

[tool.setuptools]
packages = ["rcfo"]
